  <style>
    :root{
      --bg:#070a12;
      --bg-2:#0d1220;
      --card:rgba(255,255,255,.045);
      --card-brd:rgba(255,255,255,.09);
      --txt:#eef2ff;
      --muted:#94a3b8;
      --brand:#229ED9;      /* Telegram blue */
      --brand-2:#37bdfc;
      --brand-3:#7c5cff;
      --glow:0 0 60px rgba(34,158,217,.45);
      --radius:22px;
    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);
      color:var(--txt);
      display:flex;align-items:center;justify-content:center;
      min-height:100dvh;
      padding:24px;
      overflow-x:hidden;
      position:relative;
      -webkit-font-smoothing:antialiased;
    }

    /* ── Animated background orbs ── */
    body::before,body::after{
      content:"";position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none;
      animation:float 14s ease-in-out infinite;
    }
    body::before{
      width:520px;height:520px;
      background:radial-gradient(circle,rgba(34,158,217,.55),transparent 70%);
      top:-160px;left:-160px;
    }
    body::after{
      width:560px;height:560px;
      background:radial-gradient(circle,rgba(124,92,255,.42),transparent 70%);
      bottom:-200px;right:-180px;
      animation-delay:-7s;
    }
    @keyframes float{
      0%,100%{transform:translate(0,0) scale(1)}
      50%{transform:translate(50px,-40px) scale(1.12)}
    }

    /* ── Subtle grid overlay ── */
    .grid{
      position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:56px 56px;
      mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%);
      -webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%);
    }

    /* ── Main card ── */
    .card{
      position:relative;z-index:2;
      width:100%;max-width:440px;
      background:var(--card);
      border:1px solid var(--card-brd);
      border-radius:var(--radius);
      padding:44px 30px 34px;
      text-align:center;
      backdrop-filter:blur(28px) saturate(160%);
      -webkit-backdrop-filter:blur(28px) saturate(160%);
      box-shadow:
        0 30px 70px -20px rgba(0,0,0,.75),
        inset 0 1px 0 rgba(255,255,255,.07),
        var(--glow);
      animation:rise .8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes rise{
      from{opacity:0;transform:translateY(28px) scale(.97)}
      to{opacity:1;transform:none}
    }

    /* animated border shimmer */
    .card::before{
      content:"";position:absolute;inset:-1px;border-radius:var(--radius);padding:1px;
      background:linear-gradient(140deg,rgba(34,158,217,.75),transparent 40%,transparent 60%,rgba(124,92,255,.65));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
      pointer-events:none;
    }

    /* ── Verified badge pill ── */
    .pill{
      display:inline-flex;align-items:center;gap:7px;
      font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--brand-2);
      background:rgba(34,158,217,.11);
      border:1px solid rgba(34,158,217,.3);
      padding:6px 14px;border-radius:99px;
      margin-bottom:26px;
      animation:rise .8s .1s cubic-bezier(.16,1,.3,1) both;
    }
    .pill .dot{
      width:6px;height:6px;border-radius:50%;background:var(--brand-2);
      box-shadow:0 0 10px var(--brand-2);
      animation:pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.4;transform:scale(.75)}
    }

    /* ── Channel photo ── */
    .avatar-wrap{
      position:relative;width:132px;height:132px;margin:0 auto 22px;
      animation:rise .8s .15s cubic-bezier(.16,1,.3,1) both;
    }
    .avatar-ring{
      position:absolute;inset:-5px;border-radius:50%;
      background:conic-gradient(from 0deg,var(--brand),var(--brand-3),var(--brand-2),var(--brand));
      animation:spin 5s linear infinite;
      filter:blur(1px);
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .avatar{
      position:absolute;inset:0;width:100%;height:100%;
      border-radius:50%;object-fit:cover;
      border:4px solid #0b0f1a;
      background:#131826;
      display:block;
    }
    .verified{
      position:absolute;bottom:6px;right:6px;
      width:34px;height:34px;border-radius:50%;
      background:linear-gradient(140deg,var(--brand-2),var(--brand));
      border:3px solid #0b0f1a;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 20px rgba(34,158,217,.7);
      z-index:3;
    }
    .verified svg{width:15px;height:15px;fill:#fff}

    /* ── Text ── */
    h1{
      font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.18;
      margin-bottom:11px;
      background:linear-gradient(180deg,#fff,#b8c6e6);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:rise .8s .2s cubic-bezier(.16,1,.3,1) both;
    }
    .handle{
      font-size:14.5px;color:var(--brand-2);font-weight:600;
      margin-bottom:16px;letter-spacing:.2px;
      animation:rise .8s .25s cubic-bezier(.16,1,.3,1) both;
    }
    .desc{
      font-size:14.5px;line-height:1.62;color:var(--muted);
      max-width:330px;margin:0 auto 28px;
      animation:rise .8s .3s cubic-bezier(.16,1,.3,1) both;
    }

    /* ── Stats row ── */
    .stats{
      display:flex;justify-content:center;gap:12px;
      margin-bottom:28px;
      animation:rise .8s .35s cubic-bezier(.16,1,.3,1) both;
    }
    .stat{
      flex:1;max-width:118px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.07);
      border-radius:14px;padding:12px 8px;
    }
    .stat b{display:block;font-size:16.5px;font-weight:800;color:#fff;margin-bottom:2px}
    .stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}

    /* ── Join button ── */
    .join-btn{
      position:relative;display:flex;align-items:center;justify-content:center;gap:11px;
      width:100%;padding:18px 24px;
      font-size:16px;font-weight:800;letter-spacing:.2px;color:#fff;
      text-decoration:none;
      background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 55%,var(--brand-3) 130%);
      border-radius:16px;
      border:none;cursor:pointer;overflow:hidden;
      box-shadow:
        0 14px 34px -8px rgba(34,158,217,.65),
        inset 0 1px 0 rgba(255,255,255,.28);
      transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s;
      animation:rise .8s .4s cubic-bezier(.16,1,.3,1) both;
    }
    .join-btn svg{width:21px;height:21px;fill:#fff;flex-shrink:0}
    .join-btn::after{
      content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
      transform:skewX(-22deg);
      animation:shine 3.4s ease-in-out infinite;
    }
    @keyframes shine{
      0%{left:-120%}
      55%{left:130%}
      100%{left:130%}
    }
    .join-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 22px 46px -10px rgba(34,158,217,.85),inset 0 1px 0 rgba(255,255,255,.35);
    }
    .join-btn:active{transform:translateY(-1px) scale(.985)}

    /* ── Footer note ── */
    .foot{
      margin-top:20px;font-size:11.5px;color:#5c6b85;font-weight:500;
      display:flex;align-items:center;justify-content:center;gap:6px;
      animation:rise .8s .45s cubic-bezier(.16,1,.3,1) both;
    }
    .foot svg{width:12px;height:12px;fill:#5c6b85}

    /* ── Responsive ── */
    @media(max-width:420px){
      .card{padding:36px 22px 28px;border-radius:20px}
      h1{font-size:23px}
      .avatar-wrap{width:114px;height:114px}
      .join-btn{padding:16px 20px;font-size:15px}
      .desc{font-size:13.5px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>
